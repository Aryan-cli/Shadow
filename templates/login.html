{{define "title"}}Login — Shadow{{end}}

{{define "content"}}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2>Welcome back</h2>
      <p>Sign in to your Shadow account</p>
    </div>

    {{if .Error}}
    <div class="auth-error" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/login" class="auth-form" novalidate>
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

      <div class="field-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
          placeholder="your_username"
        >
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          placeholder="••••••••"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-full">Sign in</button>
    </form>

    <p class="auth-footer">
      No account yet? <a href="/register">Register here</a>
    </p>
  </div>
</section>
{{end}}
