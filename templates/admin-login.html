{{define "admin-login"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Shadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #050506;
  --surface: rgba(255,255,255,0.04);
  --text: #F2F2F0;
  --text-dim: #8A8A8F;
  --accent: #FFFFFF;
  --line: rgba(255,255,255,0.09);
  --red: #FF4545;
}
body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.login-box { width: 100%; max-width: 380px; }
.login-logo { font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2rem; text-align: center; }
.login-logo span { color: var(--text); }
h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 2rem; }
.field { margin-bottom: 1rem; }
label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.4rem; }
input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.65rem 0.85rem; color: var(--text); font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.15s; }
input:focus { border-color: rgba(255,255,255,0.3); }
.btn { width: 100%; padding: 0.7rem 1rem; background: var(--accent); color: #000; border: none; border-radius: 8px; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
.btn:hover { opacity: 0.88; }
.error { background: rgba(255,69,69,0.1); border: 1px solid rgba(255,69,69,0.3); border-radius: 8px; padding: 0.65rem 0.85rem; color: var(--red); font-size: 0.875rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo"><span>Shadow</span> / admin</div>
  <h1>Admin access</h1>
  <p>Enter your admin credentials to continue.</p>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="POST" action="/admin/login">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
{{end}}
